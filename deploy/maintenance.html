<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统维护中 - AutoCC</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.card {
  background: rgba(255,255,255,.95); color: #1e293b; border-radius: 16px;
  padding: 48px 40px; max-width: 440px; width: 90%; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.icon { font-size: 4rem; margin-bottom: 16px; }
h1 { font-size: 1.5rem; margin-bottom: 8px; }
.sub { font-size: .95rem; color: #64748b; margin-bottom: 32px; line-height: 1.6; }
.contact-box {
  background: #eef2ff; border: 2px solid #6366f1; border-radius: 12px;
  padding: 20px; margin-bottom: 24px;
}
.contact-box p { font-size: .9rem; color: #4338ca; margin-bottom: 8px; font-weight: 600; }
.wechat { font-size: 1.5rem; font-weight: 800; color: #6366f1; letter-spacing: 1px; }
.note { font-size: .78rem; color: #94a3b8; line-height: 1.8; }
.note a { color: #6366f1; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔧</div>
  <h1>系统临时维护中</h1>
  <p class="sub">我们正在对系统进行升级优化<br>预计短时间内恢复，敬请谅解</p>
  <div class="contact-box">
    <p>如需紧急处理，请联系客服</p>
    <div class="wechat">💬 X18130093720</div>
  </div>
  <p class="note">
    扫码或搜索上方微信号添加客服<br>
    人工协助完成任务，无需等待
  </p>
</div>
</body>
</html>
